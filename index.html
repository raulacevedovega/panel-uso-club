<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Panel de uso del club</title>
<style>
:root{--bg:#f3f4ef;--surface:#fff;--ink:#1b2a22;--muted:#5f6d64;--line:#d9ddd2;--accent:#1f6b45}
@media(prefers-color-scheme:dark){:root{--bg:#101813;--surface:#17221b;--ink:#e7ece4;--muted:#93a398;--line:#2b3a30;--accent:#4fb37e;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px system-ui,'Segoe UI',sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(340px,100%);display:grid;gap:12px}
h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0}.s{color:var(--muted);font-size:13px;margin:0}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer;font-weight:600}.e{color:#b3261e;min-height:1.2em;font-size:13px}
</style></head><body>
<form id="f"><h1>Panel de uso del club</h1><p class="s">Club de Golf Las Brisas de Chicureo</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="Clave de acceso" aria-label="Clave de acceso">
<button type="submit" id="go">Ingresar</button><div class="e" id="e" role="alert"></div></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(e,pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},k,b64(e.ct)))}

async function open_(pw){const e=document.getElementById('e');e.textContent='Abriendo…';
 try{const r=await fetch('panel.enc.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();const h=await dec(j,pw);window.__pw=pw;try{localStorage.setItem('puclub',pw)}catch(x){}document.open();document.write(h);document.close();return true}
 catch(x){e.textContent=(window.crypto&&crypto.subtle)?'Clave incorrecta.':'Este navegador no puede abrir el panel desde este enlace.';return false}}
document.getElementById('f').onsubmit=ev=>{ev.preventDefault();open_(document.getElementById('pw').value.trim())};
(async()=>{let s='';try{s=localStorage.getItem('puclub')||''}catch(x){}if(s&&!(await open_(s))){try{localStorage.removeItem('puclub')}catch(x){}document.getElementById('e').textContent=''}})();
</script></body></html>
